---
Name: carehome
After:
  - '#coreconfig'
---
SilverStripe\Security\Member:
  extensions:
    - YouWillLikeIT\CareHome\Extension\MemberCareExtension

# --- Services (constructor injection) -------------------------------------
SilverStripe\Core\Injector\Injector:
  YouWillLikeIT\CareHome\Pdf\PdfRendererInterface:
    class: YouWillLikeIT\CareHome\Pdf\MpdfRenderer
  YouWillLikeIT\CareHome\Service\AuditLogger:
    constructor:
      - '%$YouWillLikeIT\CareHome\Service\AuditContext'
  YouWillLikeIT\CareHome\Service\TaskGenerator:
    constructor:
      - '%$YouWillLikeIT\CareHome\Service\Clock'
  YouWillLikeIT\CareHome\Service\BedAssignmentService:
    constructor:
      - '%$YouWillLikeIT\CareHome\Service\Clock'
  YouWillLikeIT\CareHome\Service\PatientLifecycleService:
    constructor:
      - '%$YouWillLikeIT\CareHome\Service\BedAssignmentService'
      - '%$YouWillLikeIT\CareHome\Service\TaskGenerator'
      - '%$YouWillLikeIT\CareHome\Service\Clock'
  YouWillLikeIT\CareHome\Service\MealSelectionService:
    constructor:
      - '%$YouWillLikeIT\CareHome\Service\Clock'
  YouWillLikeIT\CareHome\Service\TaskStatusService:
    constructor:
      - '%$YouWillLikeIT\CareHome\Service\Clock'
      - '%$YouWillLikeIT\CareHome\Service\ZoneScope'
  YouWillLikeIT\CareHome\Service\ShiftResolver:
    constructor:
      - '%$YouWillLikeIT\CareHome\Service\Clock'
  YouWillLikeIT\CareHome\Service\KitchenSummaryService:
    constructor:
      - '%$YouWillLikeIT\CareHome\Service\Clock'
  YouWillLikeIT\CareHome\Service\MedicalReportService:
    constructor:
      - '%$YouWillLikeIT\CareHome\Service\Clock'
      - '%$YouWillLikeIT\CareHome\Pdf\PdfRendererInterface'
  YouWillLikeIT\CareHome\Dev\DemoSeeder:
    constructor:
      - '%$YouWillLikeIT\CareHome\Service\Clock'
  YouWillLikeIT\CareHome\Security\PortalAuthenticator:
    constructor:
      - '%$YouWillLikeIT\CareHome\Security\PinHasher'
      - '%$YouWillLikeIT\CareHome\Service\AuditLogger'

